<!doctype html>

    <title>BEST SOUNDBOARD EVER</title>
    <style>
      #background-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -2;
        filter: blur(4px) brightness(0.9); /* Flou + assombrissement */
      }

      /* Couche noire semi-transparente par-dessus */
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.2);
        z-index: -1;
      }

      body {
        margin: 0;
        text-align: center;
        font-family: Arial, sans-serif;
        color: white;
        position: relative;
        z-index: 1;
      }

      h1 {
        margin-top: 20px;
        font-size: 3em;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8); /* Petit effet d'ombre */
      }

      .categories {
        margin: 20px;
        z-index: 1;
        position: relative;
      }

      .categories button {
        margin: 5px;
        padding: 12px 24px;
        border: none;
        border-radius: 30px;
        background: linear-gradient(270deg, #ff6ec4, #7873f5, #4facfe, #00f2fe);
        background-size: 800% 800%;
        color: white;
        font-size: 18px;
        cursor: pointer;
        animation: gradientMove 10s infinite;
        transition: transform 0.3s;
        box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.4);
      }

      .categories button:hover {
        transform: scale(1.1);
      }

      @keyframes gradientMove {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .section {
        display: none;
        margin-top: 20px;
        animation: fadeIn 0.5s ease forwards;
      }

      iframe.sound {
        margin: 10px;
        border-radius: 10px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
